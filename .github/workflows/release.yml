name: Release to JitPack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release targets
    uses: ./.github/workflows/ci.yml

  jitpack:
    name: Build and verify JitPack artifact
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0; received ${RELEASE_VERSION}." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify the tagged publication locally
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          ./gradlew --stacktrace :floaty:publishToMavenLocal
          -PjitpackGroup=com.github.hosseinkarami-dev.floaty-compose
          -PVERSION_NAME="$RELEASE_VERSION"

      - name: Package Maven publications
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          group_dir="$HOME/.m2/repository/com/github/hosseinkarami-dev/floaty-compose"
          test -d "$group_dir/floaty/${RELEASE_VERSION}"
          python3 - "$group_dir" "$RELEASE_VERSION" "$RUNNER_TEMP/floaty-${version}-maven-publications.zip" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZIP_DEFLATED, ZipFile

          group_dir = Path(sys.argv[1])
          release_version = sys.argv[2]
          archive_path = Path(sys.argv[3])
          with ZipFile(archive_path, "w", ZIP_DEFLATED) as archive:
              for module_dir in sorted(group_dir.glob("floaty*")):
                  version_dir = module_dir / release_version
                  if version_dir.is_dir():
                      for path in sorted(version_dir.rglob("*")):
                          if path.is_file():
                              archive.write(path, path.relative_to(group_dir))
          PY

      - name: Request and verify the JitPack publication
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          artifact_url="https://jitpack.io/com/github/hosseinkarami-dev/floaty-compose/floaty/${RELEASE_VERSION}/floaty-${RELEASE_VERSION}.pom"
          echo "Requesting ${artifact_url}"
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 30 --retry-max-time 900 \
            "$artifact_url" --output /tmp/floaty-release.pom
          grep -q '<artifactId>floaty</artifactId>' /tmp/floaty-release.pom
          grep -q "<version>${RELEASE_VERSION}</version>" /tmp/floaty-release.pom
          echo "JitPack resolved ${RELEASE_VERSION}."

      - name: Publish GitHub Release and Maven ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          archive="$RUNNER_TEMP/floaty-${version}-maven-publications.zip"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$archive" --clobber
          else
            gh release create "$RELEASE_VERSION" "$archive" \
              --title "Floaty ${RELEASE_VERSION}" \
              --generate-notes \
              --latest
          fi
