name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Android, JVM, web, and publication
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and compile supported targets
        run: >-
          ./gradlew --stacktrace
          :floaty:jvmTest
          :floaty:compileAndroidMain
          :floaty:compileKotlinJvm
          :floaty:compileKotlinJs
          :floaty:compileKotlinWasmJs
          :floaty:publishToMavenLocal
          :androidApp:assembleDebug
          :desktopApp:compileKotlin
          :webApp:compileKotlinJs
          :webApp:compileKotlinWasmJs

  ios:
    name: iOS compilation
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compile iOS library and sample targets
        run: >-
          ./gradlew --stacktrace
          :floaty:compileKotlinIosArm64
          :floaty:compileKotlinIosSimulatorArm64
          :shared:compileKotlinIosArm64
          :shared:compileKotlinIosSimulatorArm64
